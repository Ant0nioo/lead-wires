name: Build LeadWires

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create buildSettings.properties
        run: echo "outputDir=./target" > buildSettings.properties

      - name: Build with Maven
        run: mvn clean install

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: LeadWires-1.21-fix
          path: target/LeadWires.jar
